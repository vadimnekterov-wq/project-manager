<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Регистрация — Project Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container-fluid { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .register-wrapper { max-width: 1200px; width: 100%; display: flex; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.3); }

        .left-panel {
            background: linear-gradient(135deg, #667eea, #764ba2);
            width: 50%;
            padding: 50px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right-panel {
            background: rgba(255, 255, 255, 0.98);
            width: 50%;
            padding: 50px;
        }

        .brand-box { display: inline-block; background: rgba(0,0,0,0.1); padding: 10px 25px; border-radius: 40px; font-weight: bold; font-size: 1.2rem; margin-bottom: 30px; }
        .feature-list { list-style: none; padding: 0; }
        .feature-list li { margin-bottom: 15px; font-size: 1rem; display: flex; align-items: center; gap: 12px; }
        .form-control { border-radius: 40px; padding: 14px 20px; border: 2px solid #e2e8f0; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 40px; padding: 14px; font-weight: 600; width: 100%; transition: all 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102,126,234,0.4); }
        h3 { color: #1a202c; font-weight: 700; text-align: center; font-size: 2rem; margin-bottom: 10px; }

        @media (max-width: 768px) { .register-wrapper { flex-direction: column; } .left-panel, .right-panel { width: 100%; } }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="register-wrapper">
        <div class="left-panel">
            <div class="brand-box"><i class="fas fa-tasks"></i> Project Manager</div>
            <h1 class="display-5 fw-bold mb-4">Управление проектами</h1>
            <p class="mb-4">Современная платформа для эффективной работы.</p>
            <ul class="feature-list">
                <li><i class="fas fa-envelope"></i> Регистрация с подтверждением email</li>
                <li><i class="fas fa-users"></i> Роли: Админ, Менеджер, Пользователь</li>
                <li><i class="fas fa-clock"></i> Учёт времени и форумы</li>
                <li><i class="fas fa-chart-line"></i> Статистика и уведомления</li>
            </ul>
        </div>

        <div class="right-panel">
            <h3 class="mb-3">Создайте аккаунт</h3>
            <p class="text-center text-muted mb-4">Заполните форму для регистрации</p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label class="form-label">Имя пользователя</label>
                    <input type="text" class="form-control" name="username" placeholder="Введите логин" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" placeholder="example@mail.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" name="password" placeholder="минимум 3 символа" required>
                </div>
                <button type="submit" class="btn-primary">Зарегистрироваться <i class="fas fa-user-plus"></i></button>
                <p class="text-center mt-3">← <a th:href="@{/login}">Назад к входу</a></p>
            </form>
        </div>
    </div>
</div>
</body>
</html>
