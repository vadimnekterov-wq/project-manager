<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }
        .register-card h2 { text-align: center; font-weight: bold; color: #333; margin-bottom: 30px; }
        .form-control { border-radius: 10px; padding: 12px 15px; border: 2px solid #e0e0e0; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25); }
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; border-radius: 10px; padding: 12px;
            font-weight: bold; font-size: 1.1rem; width: 100%; color: white;
        }
    </style>
</head>
<body>
<div class="register-card">
    <h2>📝 Регистрация</h2>
    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label">👤 Имя пользователя</label>
            <input type="text" class="form-control" name="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label">📧 Email</label>
            <input type="email" class="form-control" name="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">🔒 Пароль</label>
            <input type="password" class="form-control" name="password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-register">Зарегистрироваться</button>
    </form>
    <p class="text-center mt-3">Уже есть аккаунт? <a href="/login">Войти</a></p>
</div>
</body>
</html>
