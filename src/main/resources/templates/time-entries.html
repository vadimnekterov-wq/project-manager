<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учёт времени</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Проектный менеджер</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/projects">← Назад к проектам</a>
        </div>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/logout">Выход</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h1>Учёт времени</h1>
    <form th:action="@{/time/start}" method="post" class="mb-3">
        <input type="hidden" name="taskId" th:value="${taskId}">
        <button type="submit" class="btn btn-success">▶ Запустить таймер</button>
    </form>
    <p>Всего минут: <strong th:text="${totalMinutes}"></strong></p>
    <table class="table">
        <thead><tr><th>ID</th><th>Начало</th><th>Конец</th><th>Действия</th></tr></thead>
        <tbody>
        <tr th:each="e : ${entries}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.startTime}"></td>
            <td th:text="${e.endTime}"></td>
            <td>
                <a th:if="${e.endTime == null}"
                   th:href="@{/time/stop/{id}/{taskId}(id=${e.id},taskId=${taskId})}"
                   class="btn btn-danger btn-sm">⏹ Остановить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
