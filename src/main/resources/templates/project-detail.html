<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title th:text="${project.name}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
        .detail-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); margin-top: 30px; }
        .btn-action { border-radius: 25px; padding: 10px 25px; font-weight: bold; margin-right: 10px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📋 Проектный менеджер</a>
        <a class="nav-link text-white" href="/projects">← Назад к проектам</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text text-white me-3">👤 <strong th:text="${username}"></strong></span>
            <a class="nav-link" href="/logout">🚪 Выход</a>
        </div>
    </div>
</nav>
<div class="container">
    <div class="detail-card">
        <h1 th:text="${project.name}"></h1>
        <p th:text="${project.description}"></p>
        <a th:href="@{/tasks/project/{id}(id=${project.id})}" class="btn btn-info btn-action">✅ Задачи</a>
        <a th:href="@{/forum/project/{id}(id=${project.id})}" class="btn btn-warning btn-action">💬 Форум</a>
        <a th:if="${role == 'ROLE_ADMIN'}" th:href="@{/projects/{id}/delete(id=${project.id})}" class="btn btn-danger btn-action">🗑 Удалить проект</a>
    </div>
</div>
</body>
</html>
