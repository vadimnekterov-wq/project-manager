<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title th:text="${project.name}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #1a47db 0%, #0d2a8a 100%); font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .navbar-dark { background: linear-gradient(135deg, #1a47db 0%, #0d2a8a 100%) !important; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .detail-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 30px; }
        .btn-action { border-radius: 8px; padding: 10px 25px; font-weight: bold; margin-right: 10px; }
        .btn-info, .btn-warning, .btn-danger { border-radius: 8px !important; }
        h1 { color: #1a237e; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📋 Проектный менеджер</a>
        <a class="nav-link text-white" href="/projects">← Назад к проектам</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text text-white me-3">👤 <strong th:text="${username}"></strong></span>
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn-logout">Выйти</button>
            </form>
        </div>
    </div>
</nav>
<div class="container">
    <div class="detail-card">
        <h1 th:text="${project.name}"></h1>
        <p th:text="${project.description}"></p>
        <a th:href="@{/tasks/project/{id}(id=${project.id})}" class="btn btn-info btn-action">✅ Задачи</a>
        <a th:href="@{/forum/project/{id}(id=${project.id})}" class="btn btn-warning btn-action">💬 Форум</a>
        <a th:if="${role == 'ROLE_ADMIN'}" th:href="@{/projects/{id}/delete(id=${project.id})}" class="btn btn-danger btn-action">🗑 Удалить проект</a>
    </div>
</div>
</body>
</html>
