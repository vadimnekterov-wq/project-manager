<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задача</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Проектный менеджер</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/tasks/project/{id}(id=${task.projectId})}">← Назад к задачам</a>
        </div>
    </div>
</nav>
<div class="container mt-4" style="max-width: 600px;">
    <h1 th:text="${task.id == null ? 'Новая задача' : 'Редактировать задачу'}"></h1>
    <form th:action="@{/tasks}" th:object="${task}" method="post">
        <input type="hidden" th:field="*{projectId}">
        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" class="form-control" th:field="*{title}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Описание</label>
            <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Статус</label>
            <select class="form-control" th:field="*{status}">
                <option value="NEW">Новая</option>
                <option value="IN_PROGRESS">В работе</option>
                <option value="DONE">Завершена</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Приоритет</label>
            <select class="form-control" th:field="*{priority}">
                <option value="LOW">Низкий</option>
                <option value="MEDIUM">Средний</option>
                <option value="HIGH">Высокий</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a th:href="@{/tasks/project/{id}(id=${task.projectId})}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
