<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Панель управления</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .navbar-custom {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            padding: 12px 40px;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.1);
        }
        .navbar-brand {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-link {
            color: #4a5568 !important;
            font-weight: 600;
            margin: 0 8px;
            padding: 8px 20px !important;
            border-radius: 40px;
            transition: all 0.3s;
        }
        .nav-link i { margin-right: 8px; }
        .nav-link:hover, .nav-link.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white !important;
            transform: translateY(-3px);
        }

        .user-menu {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 8px 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-weight: 500;
        }
        .role-badge {
            background: rgba(255,255,255,0.25);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
        }
        .btn-logout {
            background: transparent;
            border: 2px solid #ef4444;
            color: #ef4444;
            border-radius: 40px;
            padding: 8px 22px;
            transition: all 0.3s;
        }
        .btn-logout:hover {
            background: #ef4444;
            color: white;
            transform: translateY(-2px);
        }

        /* КАРТОЧКИ С БОЛЬШИМИ ИКОНКАМИ (БЕЗ КРУГЛЫШКОВ) */
        .stat-card {
            display: block;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 28px;
            padding: 40px 25px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 30px 50px rgba(0,0,0,0.2);
        }

        /* БОЛЬШАЯ ИКОНКА (ФИГУРКА) БЕЗ КРУЖКА */
        .stat-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
        }

        /* РАЗНЫЕ ЦВЕТА ДЛЯ РАЗНЫХ КАРТОЧЕК */
        .stat-card:nth-child(1) .stat-icon { color: #667eea; }
        .stat-card:nth-child(2) .stat-icon { color: #48bb78; }
        .stat-card:nth-child(3) .stat-icon { color: #ed8936; }

        .stat-card h3 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #2d3748;
        }
        .stat-card p { color: #718096; font-weight: 500; margin: 0; }

        .page-title {
            color: white;
            font-weight: 700;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 35px;
            font-size: 2rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            .navbar-custom { padding: 12px 20px; }
            .nav-link { padding: 6px 12px !important; font-size: 0.9rem; }
            .stat-icon { font-size: 2.5rem; }
            .stat-card h3 { font-size: 1.3rem; }
            .stat-card { padding: 25px 15px; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">
            <i class="fas fa-tasks"></i> Project Manager
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/dashboard">
                        <i class="fas fa-home"></i> Главная
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/projects">
                        <i class="fas fa-folder"></i> Проекты
                    </a>
                </li>
                <li class="nav-item" th:if="${isAdmin}">
                    <a class="nav-link" href="/admin/users">
                        <i class="fas fa-users-cog"></i> Пользователи
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <div class="user-menu">
                    <i class="fas fa-user-circle"></i>
                    <span th:text="${username}">admin</span>
                    <span class="role-badge" th:text="${isAdmin} ? 'ADMIN' : (${isManager} ? 'MANAGER' : 'USER')"></span>
                </div>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn-logout">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="page-title">
        <i class="fas fa-chart-line"></i> Панель управления
    </h2>

    <div class="row g-4">
        <!-- Карточка ПРОЕКТЫ -->
        <div class="col-md-4">
            <a href="/projects" class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-folder-open"></i>
                </div>
                <h3>Проекты</h3>
                <p>Управление проектами</p>
            </a>
        </div>

        <!-- Карточка ЗАДАЧИ -->
        <div class="col-md-4">
            <a href="/projects" class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-tasks"></i>
                </div>
                <h3>Задачи</h3>
                <p>Управление задачами</p>
            </a>
        </div>

        <!-- Карточка ФОРУМ -->
        <div class="col-md-4">
            <a href="/projects" class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <h3>Форум</h3>
                <p>Обсуждения в проектах</p>
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
