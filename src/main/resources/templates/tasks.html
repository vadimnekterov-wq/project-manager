<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .content-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }
        .table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-create {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: bold;
            color: white;
        }
        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📋 Проектный менеджер</a>
        <a class="nav-link text-white" href="/projects">← Назад к проектам</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text text-white me-3">
                👤 <strong th:text="${username}"></strong> (<span th:text="${role}"></span>)
            </span>
            <a class="nav-link" href="/logout">🚪 Выход</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="content-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>✅ Задачи</h1>
            <div>
                <a th:href="@{/tasks/statistics/{id}(id=${projectId})}" class="btn btn-outline-info me-2">📊 Статистика</a>
                <div th:if="${role == 'ROLE_ADMIN' || role == 'ROLE_MANAGER'}" style="display: inline;">
                    <a th:href="@{/tasks/new/{id}(id=${projectId})}" class="btn btn-create">➕ Создать задачу</a>
                </div>
            </div>
        </div>

        <form th:action="@{/tasks/search}" method="get" class="row g-2 mb-3">
            <div class="col-auto">
                <input type="text" name="query" class="form-control" placeholder="🔍 Поиск по задачам..." th:value="${query}">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-outline-primary">Искать</button>
            </div>
            <div class="col-auto">
                <a th:href="@{/tasks/project/{id}(id=${projectId})}" class="btn btn-outline-secondary">Сбросить</a>
            </div>
        </form>

        <table class="table table-hover">
            <thead>
            <tr><th>ID</th><th>Название</th><th>Статус</th><th>Приоритет</th><th>Действия</th></tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tasks}">
                <td><span class="badge bg-secondary" th:text="${t.id}"></span></td>
                <td th:text="${t.title}"></td>
                <td>
                        <span class="badge"
                              th:classappend="${t.status == 'NEW' ? 'bg-primary' : (t.status == 'IN_PROGRESS' ? 'bg-warning' : 'bg-success')}"
                              th:text="${t.status}"></span>
                </td>
                <td th:text="${t.priority}"></td>
                <td>
                    <a th:href="@{/tasks/{id}/edit(id=${t.id})}" class="btn btn-outline-warning btn-sm">✏️</a>
                    <a th:href="@{/time/task/{id}(id=${t.id})}" class="btn btn-outline-info btn-sm">⏱</a>
                    <a th:if="${role == 'ROLE_ADMIN'}" th:href="@{/tasks/{id}/delete/{pid}(id=${t.id},pid=${t.projectId})}" class="btn btn-outline-danger btn-sm">🗑</a>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:if="${tasks.empty}" class="alert alert-info">Задачи не найдены</div>
    </div>
</div>
</body>
</html>
