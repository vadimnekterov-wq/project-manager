<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Задачи проекта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); background-size: 200% 200%; animation: gradientShift 8s ease infinite; font-family: 'Poppins', sans-serif; min-height: 100vh; }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .navbar-custom { background: rgba(255,255,255,0.98); backdrop-filter: blur(15px); padding: 12px 40px; border-radius: 0 0 25px 25px; box-shadow: 0 5px 30px rgba(0,0,0,0.1); }
        .navbar-brand { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-link { color: #4a5568 !important; font-weight: 600; margin: 0 8px; padding: 8px 20px !important; border-radius: 40px; }
        .nav-link:hover, .nav-link.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white !important; transform: translateY(-3px); }
        .user-menu { background: linear-gradient(135deg, #667eea, #764ba2); padding: 8px 20px; border-radius: 40px; display: flex; align-items: center; gap: 12px; color: white; font-weight: 500; }
        .role-badge { background: rgba(255,255,255,0.25); padding: 4px 12px; border-radius: 30px; font-size: 0.75rem; }
        .btn-logout { background: transparent; border: 2px solid #ef4444; color: #ef4444; border-radius: 40px; padding: 8px 22px; transition: all 0.3s; }
        .btn-logout:hover { background: #ef4444; color: white; transform: translateY(-2px); }
        .content-card { background: rgba(255,255,255,0.98); border-radius: 28px; padding: 35px; margin: 30px auto; max-width: 1300px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 40px; padding: 10px 24px; font-weight: 600; }
        .table { background: white; border-radius: 20px; overflow: hidden; }
        .table thead { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .table thead th { padding: 15px; font-weight: 600; border: none; }
        .table tbody tr:hover { background: #f8f9fa; }
        h1 { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .btn-back { background: #718096; color: white; border-radius: 40px; padding: 8px 22px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .btn-save { background: #1a73e8; color: white; border-radius: 40px; padding: 5px 12px; border: none; font-size: 0.85rem; cursor: pointer; }
        .search-box { border-radius: 40px; padding: 10px 20px; border: 2px solid #e2e8f0; width: 250px; }
        .search-box:focus { border-color: #667eea; outline: none; }
        .form-select-sm { border-radius: 40px; padding: 5px 15px; }
        .badge { font-size: 0.8rem; }
        .desc-cell { max-width: 250px; word-wrap: break-word; }
        .due-date-cell { white-space: nowrap; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"><i class="fas fa-tasks"></i> Project Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Главная</a></li>
                <li class="nav-item"><a class="nav-link active" href="/projects"><i class="fas fa-folder"></i> Проекты</a></li>
                <li class="nav-item" th:if="${isAdmin}"><a class="nav-link" href="/admin/users"><i class="fas fa-users-cog"></i> Пользователи</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <div class="user-menu"><i class="fas fa-user-circle"></i><span th:text="${username}"></span><span class="role-badge" th:text="${isAdmin} ? 'ADMIN' : (${isManager} ? 'MANAGER' : 'USER')"></span></div>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="content-card">
        <a href="/projects" class="btn-back"><i class="fas fa-arrow-left"></i> Назад к проектам</a>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h1><i class="fas fa-tasks"></i> Задачи проекта</h1>
            <div class="d-flex align-items-center gap-2">
                <form th:action="@{/tasks/search}" method="get" class="d-flex">
                    <input type="text" name="query" class="search-box" placeholder="🔍 Поиск..." th:value="${query}">
                    <button type="submit" class="btn btn-primary btn-sm ms-2">Найти</button>
                </form>
                <a th:href="@{/tasks/statistics/{id}(id=${projectId})}" class="btn btn-outline-primary btn-sm"><i class="fas fa-chart-line"></i> Статистика</a>
                <a th:if="${isAdmin || isManager}" th:href="@{/tasks/new/{id}(id=${projectId})}" class="btn btn-primary btn-sm"><i class="fas fa-plus"></i> Создать задачу</a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Исполнитель</th>
                    <th>Срок</th>
                    <th>Описание</th>
                    <th>Статус</th>
                    <th>Приоритет</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tasks}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.title}"></td>
                    <td>
                        <span th:if="${t.assigneeId != null}" th:text="${assigneeNames.get(t.assigneeId)}"></span>
                        <span th:unless="${t.assigneeId != null}" class="text-muted">—</span>
                    </td>
                    <td class="due-date-cell">
                        <span th:if="${t.dueDate != null}" th:text="${#temporals.format(t.dueDate, 'dd.MM.yyyy')}"></span>
                        <span th:unless="${t.dueDate != null}" class="text-muted">—</span>
                    </td>
                    <td class="desc-cell" th:text="${t.description != null ? t.description : '—'}"></td>
                    <td>
                        <!-- Статус могут менять только ADMIN, MANAGER или назначенный исполнитель -->
                        <th:block th:if="${isAdmin || isManager || currentUserId == t.assigneeId}">
                            <form th:action="@{/tasks/{id}/status(id=${t.id})}" method="post" style="display:inline;">
                                <input type="hidden" name="projectId" th:value="${projectId}">
                                <select name="status" class="form-select form-select-sm d-inline w-auto" style="border-radius: 40px;">
                                    <option value="NEW" th:selected="${t.status == 'NEW'}">🟡 Новая</option>
                                    <option value="IN_PROGRESS" th:selected="${t.status == 'IN_PROGRESS'}">🔵 В работе</option>
                                    <option value="DONE" th:selected="${t.status == 'DONE'}">✅ Завершена</option>
                                </select>
                                <button type="submit" class="btn-save ms-1">✓</button>
                            </form>
                        </th:block>
                        <th:block th:unless="${isAdmin || isManager || currentUserId == t.assigneeId}">
                            <span th:text="${t.status}"></span>
                        </th:block>
                    </td>
                    <td>
                        <span class="badge" th:class="${t.priority == 'HIGH'} ? 'bg-danger' : (${t.priority == 'MEDIUM'} ? 'bg-warning' : 'bg-success')" th:text="${t.priority}"></span>
                    </td>
                    <td>
                        <!-- Изменить и Удалить — только ADMIN и MANAGER -->
                        <a th:if="${isAdmin || isManager}" th:href="@{/tasks/{id}/edit(id=${t.id})}" class="btn btn-outline-warning btn-sm">✏️</a>
                        <!-- Запуск таймера — только ADMIN, MANAGER или исполнитель -->
                        <a th:if="${isAdmin || isManager || currentUserId == t.assigneeId}" th:href="@{/time/task/{id}(id=${t.id})}" class="btn btn-outline-info btn-sm">⏱</a>
                        <a th:if="${isAdmin || isManager}" th:href="@{/tasks/{id}/delete/{pid}(id=${t.id},pid=${t.projectId})}" class="btn btn-outline-danger btn-sm">🗑</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${tasks == null or tasks.empty}" class="text-center text-muted mt-4">
            <i class="fas fa-info-circle"></i> Задачи не найдены.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
