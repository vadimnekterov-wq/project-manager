<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Учёт времени</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .navbar-custom {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            padding: 12px 40px;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.1);
        }
        .navbar-brand { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-link { color: #4a5568 !important; font-weight: 600; margin: 0 8px; padding: 8px 20px !important; border-radius: 40px; transition: all 0.3s; }
        .nav-link:hover, .nav-link.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white !important; transform: translateY(-3px); }
        .user-menu { background: linear-gradient(135deg, #667eea, #764ba2); padding: 8px 20px; border-radius: 40px; display: flex; align-items: center; gap: 12px; color: white; font-weight: 500; }
        .role-badge { background: rgba(255,255,255,0.25); padding: 4px 12px; border-radius: 30px; font-size: 0.75rem; }
        .btn-logout { background: transparent; border: 2px solid #ef4444; color: #ef4444; border-radius: 40px; padding: 8px 22px; transition: all 0.3s; }
        .btn-logout:hover { background: #ef4444; color: white; transform: translateY(-2px); }

        .content-card { background: rgba(255, 255, 255, 0.98); border-radius: 28px; padding: 35px; margin: 30px auto; max-width: 1000px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 40px; padding: 12px 28px; font-weight: 600; transition: all 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-outline-danger { border-radius: 40px !important; border: 2px solid #ef4444 !important; color: #ef4444; transition: all 0.3s; }
        .btn-outline-danger:hover { background: #ef4444; color: white; transform: translateY(-2px); }
        .table { background: white; border-radius: 20px; overflow: hidden; }
        .table thead { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .table thead th { padding: 15px; font-weight: 600; border: none; }
        .table tbody tr:hover { background: #f8f9fa; }
        h2 { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .total-time { background: #e2e8f0; border-radius: 20px; padding: 15px; text-align: center; margin-bottom: 25px; font-size: 1.2rem; font-weight: 600; color: #2d3748; }
        .total-time span { color: #667eea; font-size: 1.8rem; margin-right: 10px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"><i class="fas fa-tasks"></i> Project Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Главная</a></li>
                <li class="nav-item"><a class="nav-link active" href="/projects"><i class="fas fa-folder"></i> Проекты</a></li>
                <li class="nav-item" th:if="${isAdmin}"><a class="nav-link" href="/admin/users"><i class="fas fa-users-cog"></i> Пользователи</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <div class="user-menu"><i class="fas fa-user-circle"></i><span th:text="${username}"></span><span class="role-badge" th:text="${isAdmin} ? 'ADMIN' : (${isManager} ? 'MANAGER' : 'USER')"></span></div>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn-logout">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="content-card">
        <!-- КНОПКА "НАЗАД" УДАЛЕНА -->
        <h2 class="mb-4 text-center"><i class="fas fa-clock"></i> Учёт времени</h2>

        <div class="text-center mb-4">
            <form th:action="@{/time/start}" method="post" style="display:inline;">
                <input type="hidden" name="taskId" th:value="${taskId}">
                <button type="submit" class="btn-primary"><i class="fas fa-play"></i> Запустить таймер</button>
            </form>
        </div>

        <div class="total-time">
            <i class="fas fa-hourglass-half"></i> Всего затрачено времени: <strong><span th:text="${totalMinutes}">0</span> минут</strong>
        </div>

        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr><th>ID</th><th>Дата</th><th>Начало</th><th>Конец</th><th>Действия</th></tr>
                </thead>
                <tbody>
                <tr th:each="e : ${entries}">
                    <td th:text="${e.id}"></td>
                    <td th:text="${e.startTime != null ? #temporals.format(e.startTime, 'dd.MM.yyyy') : ''}"></td>
                    <td th:text="${e.startTime != null ? #temporals.format(e.startTime, 'HH:mm:ss') : ''}"></td>
                    <td th:text="${e.endTime != null ? #temporals.format(e.endTime, 'HH:mm:ss') : '...'}"></td>
                    <td>
                        <a th:if="${e.endTime == null}"
                           th:href="@{/time/stop/{id}/{taskId}(id=${e.id},taskId=${taskId})}"
                           class="btn-outline-danger btn-sm" style="padding: 5px 15px; text-decoration: none;"><i class="fas fa-stop"></i> Стоп</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
