<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Форум проекта</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .navbar-custom {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            padding: 12px 40px;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.1);
        }
        .navbar-brand { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-link { color: #4a5568 !important; font-weight: 600; margin: 0 8px; padding: 8px 20px !important; border-radius: 40px; }
        .nav-link:hover, .nav-link.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white !important; transform: translateY(-3px); }
        .user-menu { background: linear-gradient(135deg, #667eea, #764ba2); padding: 8px 20px; border-radius: 40px; display: flex; align-items: center; gap: 12px; color: white; font-weight: 500; }
        .btn-logout { background: transparent; border: 2px solid #ef4444; color: #ef4444; border-radius: 40px; padding: 8px 22px; transition: all 0.3s; }
        .btn-logout:hover { background: #ef4444; color: white; transform: translateY(-2px); }
        .content-card { background: rgba(255, 255, 255, 0.98); border-radius: 28px; padding: 35px; margin: 30px auto; max-width: 800px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2) !important; border: none !important; border-radius: 40px !important; padding: 10px 28px !important; }
        .list-group-item { border-radius: 15px !important; margin-bottom: 10px; transition: all 0.3s; font-weight: 500; }
        .list-group-item:hover { background: linear-gradient(135deg, #667eea, #764ba2); color: white !important; transform: translateX(8px); border: none; }
        h2 { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .btn-back { background: #718096; color: white; border-radius: 40px; padding: 8px 22px; text-decoration: none; transition: all 0.3s; display: inline-block; }
        .btn-back:hover { background: #4a5568; color: white; transform: translateX(-5px); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"><i class="fas fa-tasks"></i> Project Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="/projects"><i class="fas fa-folder"></i> Проекты</a></li>
                <li class="nav-item" th:if="${isAdmin}"><a class="nav-link" href="/admin/users"><i class="fas fa-users-cog"></i> Пользователи</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <div class="user-menu"><i class="fas fa-user-circle"></i><span th:text="${username}"></span><span class="role-badge ms-2" th:text="${isAdmin} ? 'ADMIN' : (${isManager} ? 'MANAGER' : 'USER')"></span></div>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn-logout">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="content-card">
        <div class="mb-4">
            <a href="/projects" class="btn-back"><i class="fas fa-arrow-left"></i> Назад к проектам</a>
        </div>
        <h2 class="mb-4"><i class="fas fa-comments"></i> Форум проекта</h2>

        <!-- Только ADMIN и MANAGER могут создавать категории -->
        <form th:if="${isAdmin || isManager}" th:action="@{/forum/category}" method="post" class="mb-4">
            <input type="hidden" name="projectId" th:value="${projectId}">
            <div class="input-group">
                <input type="text" name="name" class="form-control" placeholder="Название категории" required style="border-radius: 40px 0 0 40px; padding: 12px 20px;">
                <button type="submit" class="btn btn-primary" style="border-radius: 0 40px 40px 0;">+ Создать категорию</button>
            </div>
        </form>

        <div class="list-group">
            <a th:each="c : ${categories}" th:href="@{/forum/category/{id}(id=${c.id})}" class="list-group-item list-group-item-action d-flex align-items-center">
                <i class="fas fa-folder-open me-3"></i> <span th:text="${c.name}"></span>
                <i class="fas fa-chevron-right ms-auto"></i>
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
