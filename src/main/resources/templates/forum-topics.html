<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Темы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Проектный менеджер</a>
        <a class="nav-link text-white" href="/projects">← Назад к проектам</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text text-white me-3">
                <strong th:text="${username}"></strong>
                (<span th:text="${role}"></span>)
            </span>
            <a class="nav-link" href="/logout">Выход</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h1>Темы</h1>
    <form th:action="@{/forum/topic}" method="post" class="mb-3">
        <input type="hidden" name="categoryId" th:value="${categoryId}">
        <input type="text" name="title" placeholder="Название темы" required class="form-control d-inline w-50">
        <button type="submit" class="btn btn-primary ms-2">Создать тему</button>
    </form>
    <ul class="list-group">
        <li th:each="t : ${topics}" class="list-group-item">
            <a th:href="@{/forum/topic/{id}(id=${t.id})}" th:text="${t.title}"></a>
        </li>
    </ul>
</div>
</body>
</html>
