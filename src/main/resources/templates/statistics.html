<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статистика</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }
        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .summary-cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .summary-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px 30px;
            text-align: center;
            min-width: 120px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .summary-item .number {
            font-size: 2rem;
            font-weight: bold;
        }
        .summary-item .label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📋 Проектный менеджер</a>
        <a class="nav-link text-white" th:href="@{/tasks/project/{id}(id=${projectId})}">← Назад к задачам</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/logout">🚪 Выход</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="stat-card">
        <h2 class="text-center mb-4">📊 Статистика по проекту #<span th:text="${projectId}"></span></h2>

        <div class="summary-cards">
            <div class="summary-item">
                <div class="number" th:text="${totalTasks}">0</div>
                <div class="label">📌 Всего задач</div>
            </div>
            <div class="summary-item" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                <div class="number" th:text="${newTasks}">0</div>
                <div class="label">🆕 Новые</div>
            </div>
            <div class="summary-item" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                <div class="number" th:text="${inProgressTasks}">0</div>
                <div class="label">🔄 В работе</div>
            </div>
            <div class="summary-item" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                <div class="number" th:text="${doneTasks}">0</div>
                <div class="label">✅ Завершено</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="taskBarChart"></canvas>
        </div>
    </div>
</div>

<script>
    // Получаем данные из Thymeleaf
    var newTasks = parseInt('[[${newTasks}]]' || '0');
    var inProgressTasks = parseInt('[[${inProgressTasks}]]' || '0');
    var doneTasks = parseInt('[[${doneTasks}]]' || '0');

    const ctx = document.getElementById('taskBarChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Новые', 'В работе', 'Завершено'],
            datasets: [{
                label: 'Количество задач',
                data: [newTasks, inProgressTasks, doneTasks],
                backgroundColor: [
                    'rgba(79, 172, 254, 0.8)',
                    'rgba(240, 147, 251, 0.8)',
                    'rgba(67, 233, 123, 0.8)'
                ],
                borderColor: [
                    'rgba(79, 172, 254, 1)',
                    'rgba(240, 147, 251, 1)',
                    'rgba(67, 233, 123, 1)'
                ],
                borderWidth: 2,
                borderRadius: 10,
                borderSkipped: false,
                barPercentage: 0.6,
                categoryPercentage: 0.8
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1,
                        font: { size: 14 }
                    },
                    grid: {
                        color: 'rgba(0, 0, 0, 0.05)'
                    }
                },
                x: {
                    ticks: {
                        font: { size: 14 }
                    },
                    grid: {
                        display: false
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    });
</script>
</body>
</html>
