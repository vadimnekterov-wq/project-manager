<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сообщения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Проектный менеджер</a>
        <a class="nav-link text-white" href="/projects">← Назад к проектам</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text text-white me-3">
                Вы: <strong th:text="${username}"></strong>
                (<span th:text="${role}"></span>)
            </span>
            <a class="nav-link" href="/logout">Выход</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h1>Сообщения</h1>

    <form th:action="@{/forum/post}" method="post" class="mb-3">
        <input type="hidden" name="topicId" th:value="${topicId}">
        <textarea name="body" class="form-control" rows="3" placeholder="Ваше сообщение" required></textarea>
        <button type="submit" class="btn btn-primary mt-2">Отправить</button>
    </form>

    <div th:each="p : ${posts}" class="card mb-2">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
                <p class="mb-1" th:text="${p.body}"></p>

                <form th:if="${isAdmin || currentUserId.equals(p.userId) || (isManager && !userIsAdmin.get(p.userId))}"
                      th:action="@{/forum/post/{id}/delete(id=${p.id})}"
                      method="post"
                      style="display:inline;">
                    <input type="hidden" name="topicId" th:value="${topicId}">
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('Удалить сообщение?')">🗑</button>
                </form>
            </div>
            <small class="text-muted">
                👤 <strong th:text="${userNames.get(p.userId) != null ? userNames.get(p.userId) : 'Гость'}"></strong>
                | 🕐 <span th:text="${p.createdAt}"></span>
            </small>
        </div>
    </div>

    <div th:if="${posts.empty}" class="alert alert-info">
        Нет сообщений. Будьте первым!
    </div>
</div>
</body>
</html>
