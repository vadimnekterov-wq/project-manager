<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проекты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .content-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }
        .table {
            border-radius: 15px;
            overflow: hidden;
        }
        .table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-create {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: bold;
            color: white;
            transition: all 0.3s;
        }
        .btn-create:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">📋 Проектный менеджер</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text text-white me-3">
                👤 <strong th:text="${username}"></strong> (<span th:text="${role}"></span>)
            </span>
            <a class="nav-link" href="/logout">🚪 Выход</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="content-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>📁 Проекты</h1>
            <div th:if="${role == 'ROLE_ADMIN' || role == 'ROLE_MANAGER'}">
                <a href="/projects/new" class="btn btn-create">➕ Создать проект</a>
            </div>
        </div>

        <table class="table table-hover">
            <thead>
            <tr><th>ID</th><th>Название</th><th>Действия</th></tr>
            </thead>
            <tbody>
            <tr th:each="p : ${projects}">
                <td><span class="badge bg-secondary" th:text="${p.id}"></span></td>
                <td><a th:href="@{/projects/{id}(id=${p.id})}" th:text="${p.name}" style="text-decoration: none; font-weight: 500;"></a></td>
                <td>
                    <a th:href="@{/tasks/project/{id}(id=${p.id})}" class="btn btn-outline-info btn-sm">✅ Задачи</a>
                    <a th:href="@{/forum/project/{id}(id=${p.id})}" class="btn btn-outline-warning btn-sm">💬 Форум</a>
                    <a th:if="${role == 'ROLE_ADMIN'}" th:href="@{/projects/{id}/delete(id=${p.id})}" class="btn btn-outline-danger btn-sm">🗑 Удалить</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
