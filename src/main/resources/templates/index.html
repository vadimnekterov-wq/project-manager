<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Project Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 40px;
            padding: 50px 60px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #4a5568;
            font-size: 1rem;
            margin-bottom: 35px;
        }

        .btn-login {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
            width: 100%;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.5);
            color: white;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #718096;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .feature-item i {
            color: #667eea;
            font-size: 0.9rem;
        }

        @media (max-width: 480px) {
            .welcome-card { padding: 35px 25px; }
            h1 { font-size: 1.8rem; }
            .btn-login { padding: 12px 30px; }
            .feature-item { font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="welcome-card">
    <h1>Добро пожаловать</h1>
    <p class="subtitle">Управляйте проектами, задачами и командой</p>

    <a href="/login" class="btn-login">
        <i class="fas fa-sign-in-alt"></i> Войти
    </a>

    <div class="features">
        <div class="feature-item">
            <i class="fas fa-folder"></i> Проекты
        </div>
        <div class="feature-item">
            <i class="fas fa-tasks"></i> Задачи
        </div>
        <div class="feature-item">
            <i class="fas fa-clock"></i> Учёт времени
        </div>
        <div class="feature-item">
            <i class="fas fa-comments"></i> Форум
        </div>
    </div>
</div>
</body>
</html>
