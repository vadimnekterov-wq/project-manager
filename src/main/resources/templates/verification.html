<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #1a47db 0%, #0d2a8a 100%); font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .header { text-align: center; background: linear-gradient(135deg, #1a47db 0%, #0d2a8a 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .btn { display: inline-block; background: linear-gradient(135deg, #1a47db 0%, #0d2a8a 100%); color: white; padding: 12px 30px; border-radius: 10px; text-decoration: none; font-weight: bold; margin: 20px 0; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(26,71,219,0.3); }
        .footer { color: #999; font-size: 12px; margin-top: 30px; text-align: center; }
        p { color: #333; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">📋 Проектный менеджер</div>
    <p>Здравствуйте, <strong th:text="${username}"></strong>!</p>
    <p>Вы зарегистрировались в системе управления проектами. Для подтверждения email перейдите по ссылке:</p>
    <div style="text-align: center;">
        <a class="btn" th:href="${confirmationLink}">Подтвердить email</a>
    </div>
    <p>Ссылка действительна 24 часа.</p>
    <div class="footer">С уважением, команда Проектного менеджера</div>
</div>
</body>
</html>
