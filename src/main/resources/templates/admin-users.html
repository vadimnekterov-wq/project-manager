<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Управление пользователями</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .navbar-custom { background: rgba(255,255,255,0.98); backdrop-filter: blur(15px); padding: 12px 40px; border-radius: 0 0 25px 25px; box-shadow: 0 5px 30px rgba(0,0,0,0.1); }
        .navbar-brand { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-link { color: #4a5568 !important; font-weight: 600; margin: 0 8px; padding: 8px 20px !important; border-radius: 40px; }
        .nav-link:hover, .nav-link.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white !important; }
        .user-menu { background: linear-gradient(135deg, #667eea, #764ba2); padding: 8px 20px; border-radius: 40px; display: flex; align-items: center; gap: 12px; color: white; font-weight: 500; }
        .btn-logout { background: transparent; border: 2px solid #ef4444; color: #ef4444; border-radius: 40px; padding: 8px 22px; }
        .btn-logout:hover { background: #ef4444; color: white; }
        .content-card { background: rgba(255,255,255,0.98); border-radius: 28px; padding: 35px; margin: 30px auto; max-width: 1200px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .table thead { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .table thead th { padding: 12px 10px; font-weight: 600; border-radius: 15px 15px 0 0; font-size: 0.9rem; }
        .table td { padding: 8px 10px; vertical-align: middle; font-size: 0.9rem; }
        .table tbody tr:hover { background: #f8f9fa; }
        h2 { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .blocked { background: #fff5f5; }
        .btn { border-radius: 40px !important; font-size: 0.8rem !important; padding: 4px 10px !important; }
        .search-box { border-radius: 40px; padding: 10px 20px; border: 2px solid #e2e8f0; width: 250px; }
        .search-box:focus { border-color: #667eea; outline: none; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 40px; padding: 10px 24px; font-weight: 600; color: white; }
        .mini-input { border-radius: 40px; padding: 4px 10px; border: 1.5px solid #e2e8f0; width: 100px; font-size: 0.8rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"><i class="fas fa-tasks"></i> Project Manager</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="/projects"><i class="fas fa-folder"></i> Проекты</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/users"><i class="fas fa-users-cog"></i> Пользователи</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <div class="user-menu"><i class="fas fa-user-circle"></i><span th:text="${username}"></span><span class="role-badge ms-2">ADMIN</span></div>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="content-card">
        <h2 class="mb-3"><i class="fas fa-users"></i> Управление пользователями</h2>

        <div th:if="${error}" class="alert alert-danger py-1" th:text="${error}"></div>

        <form th:action="@{/admin/users/search}" method="get" class="mb-3 d-flex">
            <input type="text" name="query" class="search-box me-2" placeholder="🔍 Поиск по никнейму..." th:value="${query}">
            <button type="submit" class="btn btn-primary btn-sm">Найти</button>
        </form>

        <div th:if="${message}" class="alert alert-success py-1" th:text="${message}"></div>
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr><th>ID</th><th>Имя</th><th>Роль</th><th>Статус</th><th>Действия</th></tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}" th:class="${u.blocked ? 'blocked' : ''}">
                    <td th:text="${u.id}"></td>
                    <td>
                        <span th:text="${u.username}"></span>
                        <span th:if="${u.mainAdmin}" class="badge bg-warning">👑</span>
                    </td>
                    <td><span class="badge" th:class="${u.role == 'ROLE_ADMIN'} ? 'bg-danger' : (${u.role == 'ROLE_MANAGER'} ? 'bg-warning' : 'bg-info')" th:text="${u.role}"></span></td>
                    <td>
                        <span th:if="${u.blocked}" class="badge bg-danger">Заблок</span>
                        <span th:unless="${u.blocked}" class="badge bg-success">Актив</span>
                    </td>
                    <td>
                        <th:block th:if="${u.mainAdmin || u.username == currentUser}">
                            <span class="text-muted">—</span>
                        </th:block>

                        <!-- Заблокирован -->
                        <form th:if="${!u.mainAdmin && u.username != currentUser && u.blocked}" th:action="@{/admin/unblock/{id}(id=${u.id})}" method="post" style="display:inline;">
                            <button class="btn btn-success btn-sm">✅</button>
                        </form>

                        <!-- Активен -->
                        <th:block th:if="${!u.mainAdmin && u.username != currentUser && !u.blocked}">
                            <form th:action="@{/admin/block/{id}(id=${u.id})}" method="post" style="display:inline;">
                                <input type="text" name="reason" class="mini-input" placeholder="Причина" required>
                                <button class="btn btn-danger btn-sm">🔒</button>
                            </form>
                            <th:block th:if="${u.role == 'ROLE_USER'}">
                                <form th:action="@{/admin/promote/manager/{id}(id=${u.id})}" method="post" style="display:inline;">
                                    <input type="text" name="reason" class="mini-input" placeholder="Причина" required>
                                    <button class="btn btn-outline-warning btn-sm">⬆М</button>
                                </form>
                            </th:block>
                            <th:block th:if="${u.role == 'ROLE_MANAGER'}">
                                <form th:action="@{/admin/promote/admin/{id}(id=${u.id})}" method="post" style="display:inline;">
                                    <input type="text" name="reason" class="mini-input" placeholder="Причина" required>
                                    <button class="btn btn-outline-danger btn-sm">⬆А</button>
                                </form>
                            </th:block>
                            <th:block th:if="${u.role == 'ROLE_ADMIN' || u.role == 'ROLE_MANAGER'}">
                                <form th:action="@{/admin/demote/user/{id}(id=${u.id})}" method="post" style="display:inline;">
                                    <input type="text" name="reason" class="mini-input" placeholder="Причина" required>
                                    <button class="btn btn-outline-secondary btn-sm">⬇</button>
                                </form>
                            </th:block>
                            <form th:action="@{/admin/delete/{id}(id=${u.id})}" method="post" style="display:inline;">
                                <input type="text" name="reason" class="mini-input" placeholder="Причина" required>
                                <button class="btn btn-dark btn-sm" onclick="return confirm('Удалить?')">🗑</button>
                            </form>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
