<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Управление пользователями</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            min-height: 100vh;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .navbar-custom {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            padding: 12px 40px;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.1);
        }
        .navbar-brand { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-link { color: #4a5568 !important; font-weight: 600; margin: 0 8px; padding: 8px 20px !important; border-radius: 40px; }
        .nav-link:hover, .nav-link.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white !important; transform: translateY(-3px); }
        .user-menu { background: linear-gradient(135deg, #667eea, #764ba2); padding: 8px 20px; border-radius: 40px; display: flex; align-items: center; gap: 12px; color: white; font-weight: 500; }
        .btn-logout { background: transparent; border: 2px solid #ef4444; color: #ef4444; border-radius: 40px; padding: 8px 22px; transition: all 0.3s; }
        .btn-logout:hover { background: #ef4444; color: white; transform: translateY(-2px); }
        .content-card { background: rgba(255, 255, 255, 0.98); border-radius: 28px; padding: 35px; margin: 30px auto; max-width: 1200px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .table thead { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        .table thead th { padding: 15px; font-weight: 600; border-radius: 15px 15px 0 0; }
        .table tbody tr:hover { background: #f8f9fa; }
        h2 { background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .blocked { background: #fff5f5; }
        .btn { border-radius: 40px !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard"><i class="fas fa-tasks"></i> Project Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="fas fa-home"></i> Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="/projects"><i class="fas fa-folder"></i> Проекты</a></li>
                <li class="nav-item"><a class="nav-link active" href="/admin/users"><i class="fas fa-users-cog"></i> Пользователи</a></li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <div class="user-menu"><i class="fas fa-user-circle"></i><span th:text="${username}"></span><span class="role-badge ms-2">ADMIN</span></div>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn-logout">Выйти</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="content-card">
        <h2 class="mb-4"><i class="fas fa-users"></i> Управление пользователями</h2>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div class="table-responsive">
            <table class="table">
                <thead>
                <tr><th>ID</th><th>Имя</th><th>Email</th><th>Роль</th><th>Статус</th><th>Действия</th></tr>
                </thead>
                <tbody>
                <tr th:each="u : ${users}" th:class="${u.blocked ? 'blocked' : ''}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.email}"></td>
                    <td><span class="badge" th:class="${u.role == 'ROLE_ADMIN'} ? 'bg-danger' : (${u.role == 'ROLE_MANAGER'} ? 'bg-warning' : 'bg-info')" th:text="${u.role}"></span></td>
                    <td><span th:if="${u.blocked}" class="badge bg-danger">Заблокирован</span><span th:unless="${u.blocked}" class="badge bg-success">Активен</span></td>
                    <td>
                        <form th:if="${!u.blocked && u.role != 'ROLE_ADMIN'}" th:action="@{/admin/block/{id}(id=${u.id})}" method="post" style="display:inline;">
                            <input type="text" name="reason" placeholder="Причина" class="form-control form-control-sm d-inline w-auto me-1" style="border-radius: 40px;" required>
                            <button class="btn btn-danger btn-sm"><i class="fas fa-ban"></i> Заблокировать</button>
                        </form>
                        <form th:if="${u.blocked}" th:action="@{/admin/unblock/{id}(id=${u.id})}" method="post" style="display:inline;">
                            <button class="btn btn-success btn-sm"><i class="fas fa-check"></i> Разблокировать</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
